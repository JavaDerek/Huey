[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "refestramus-huey"
version = "0.1.0"
description = "Offline WING snapshot fixtures and a read-only localhost replayer"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
refestramus-huey = "refestramus_huey.cli:main"

[tool.setuptools.packages.find]
include = ["refestramus_huey*"]

[tool.setuptools.package-data]
refestramus_huey = ["allow-list.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--cov=refestramus_huey", "--cov-branch", "--cov-report=term-missing", "--cov-fail-under=80"]
